name: Feature request
description: Suggest something OpenMusic should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The problem or the situation, in your own words, rather than a solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
  - type: checkboxes
    id: platforms
    attributes:
      label: Platforms
      options:
        - label: Mac
        - label: iPhone
        - label: Windows
